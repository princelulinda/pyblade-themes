[project]
name = "pyblade-themes"
version = "0.1.0"
description = "A theme editor for PyBlade UI, built with Django, PyBlade and PyBlade UI."
requires-python = ">=3.12"
dependencies = [
    "django>=6.1",
    "pyblade>=0.3.0",
    "pyblade-ui>=0.2.0",
    "psycopg[binary]>=3.2",
]

# To work on the library at the same time: uv pip install -e ../pyblade-ui
