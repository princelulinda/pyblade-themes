[project]
name = "pyblade-themes"
version = "0.1.0"
description = "A theme generator for PyBlade UI, built with Django, PyBlade and PyBlade UI."
requires-python = ">=3.12"
dependencies = [
    "django>=6.1",
    "pyblade>=0.3.0",
    "pyblade-ui",
]

[tool.uv.sources]
pyblade-ui = { path = "../pyblade-ui", editable = true }
